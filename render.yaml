services:
  - type: web
    name: duty-reporter
    runtime: node
    plan: free
    buildCommand: cd app && npm install && npm run build
    startCommand: cd app && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
    autoDeploy: true
    healthCheckPath: /health
